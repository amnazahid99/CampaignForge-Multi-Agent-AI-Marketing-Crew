[project]
name = "campaignforge"
version = "0.1.0"
description = "Multi-Agent AI Marketing Campaign Generator"
readme = "README.md"
requires-python = ">=3.11.14"
dependencies = [
    "chromadb>=1.5.1",
    "faiss-cpu>=1.13.2",
    "fastapi[standard]>=0.133.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.21",
    "langchain-ollama>=0.3.10",
    "langgraph>=0.2.0",
    "numpy==1.26.4",
    "ollama>=0.6.1",
    "onnxruntime==1.17.3",
    "pydantic>=2.0.0",
    "pypdf>=6.7.5",
    "python-dotenv>=1.2.1",
    "sentence-transformers==2.6.1",
    "streamlit>=1.54.0",
    "torch==2.2.2",
    "tenacity>=8.2.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv.workspace]
members = [
    "ragchatbot-langchain",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
